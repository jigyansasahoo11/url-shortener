<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="linkGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Back link (dark) -->
  <rect x="98" y="40" width="46" height="120" rx="23"
        transform="rotate(45 121 100)"
        fill="none" stroke="url(#linkGradientDark)" stroke-width="16"/>

  <!-- Front link (purple gradient) -->
  <rect x="56" y="40" width="46" height="120" rx="23"
        transform="rotate(-45 79 100)"
        fill="none" stroke="url(#linkGradient)" stroke-width="16"/>

  <!-- Small speed/shorten accent lines -->
  <line x1="30" y1="30" x2="50" y2="30" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="45" x2="45" y2="45" stroke="#7e22ce" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</svg>
